server_name: agent-bridge-hub
listen: 0.0.0.0:4222

# The monitoring endpoint has no built-in authentication. It is deliberately
# reachable only on the private container network and is never host-published.
http: 0.0.0.0:8222

jetstream {
  store_dir: /data/jetstream
  max_mem: 256M
  max_file: 10G
}

authorization {
  users: [
    {
      user: $NATS_ADMIN_USER
      password: $NATS_ADMIN_PASSWORD
      permissions: { publish: ">", subscribe: ">" }
    },
    {
      user: $NATS_CATALOG_USER
      password: $NATS_CATALOG_PASSWORD
      permissions: {
        publish: ["bridge.v1.>", "$JS.API.>", "$JS.ACK.>"]
        subscribe: [
          "bridge.v1.result.>",
          "bridge.v1.inbox.>",
          "bridge.v1.capability.>",
          "bridge.v1.room.>",
          "bridge.v1.event.>",
          "bridge.v1.dead.>",
          "_INBOX.>"
        ]
      }
    },
    {
      user: $NATS_NODE_A_USER
      password: $NATS_NODE_A_PASSWORD
      permissions: {
        publish: [
          "bridge.v1.inbox.>",
          "bridge.v1.capability.>",
          "bridge.v1.room.arci",
          "bridge.v1.result.>",
          "bridge.v1.event.>",
          "bridge.v1.dead.>",
          "$JS.API.CONSUMER.>",
          "$JS.ACK.>"
        ]
        subscribe: [
          "bridge.v1.inbox.node.node-a",
          "bridge.v1.control.node.node-a",
          "bridge.v1.control.capability.robot-simulator-e2e",
          "bridge.v1.control.capability.server-client-integration",
          "bridge.v1.capability.robot-simulator-e2e",
          "bridge.v1.capability.server-client-integration",
          "bridge.v1.room.arci",
          "bridge.v1.result.>",
          "_INBOX.>"
        ]
      }
    },
    {
      user: $NATS_NODE_B_USER
      password: $NATS_NODE_B_PASSWORD
      permissions: {
        publish: [
          "bridge.v1.inbox.>",
          "bridge.v1.capability.>",
          "bridge.v1.room.arci",
          "bridge.v1.result.>",
          "bridge.v1.event.>",
          "bridge.v1.dead.>",
          "$JS.API.CONSUMER.>",
          "$JS.ACK.>"
        ]
        subscribe: [
          "bridge.v1.inbox.node.node-b",
          "bridge.v1.control.node.node-b",
          "bridge.v1.control.capability.robot-simulator-e2e",
          "bridge.v1.control.capability.server-client-integration",
          "bridge.v1.capability.robot-simulator-e2e",
          "bridge.v1.capability.server-client-integration",
          "bridge.v1.room.arci",
          "bridge.v1.result.>",
          "_INBOX.>"
        ]
      }
    }
  ]
}

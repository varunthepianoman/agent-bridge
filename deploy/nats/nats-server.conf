server_name: agent-bridge-hub
listen: 0.0.0.0:4222

# Monitoring stays on the private container network; it is never host-published.
http: 0.0.0.0:8222

jetstream {
  store_dir: /data/jetstream
  max_mem: 256M
  max_file: 10G
}

# Nodes use the authenticated Hub HTTP API. Only the Hub and an emergency
# administrator need direct broker credentials in the single-user topology.
authorization {
  users: [
    {
      user: $NATS_ADMIN_USER
      password: $NATS_ADMIN_PASSWORD
      permissions: { publish: ">", subscribe: ">" }
    },
    {
      user: $NATS_CATALOG_USER
      password: $NATS_CATALOG_PASSWORD
      permissions: {
        publish: ["bridge.v1.>", "$JS.API.>", "$JS.ACK.>"]
        subscribe: ["bridge.v1.>", "$JS.API.>", "$JS.ACK.>", "_INBOX.>"]
      }
    }
  ]
}

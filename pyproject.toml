[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-bridge"
version = "0.2.0"
description = "A catalog and durable communication substrate for AI-assisted work"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.14,<2",
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "nats-py>=2.11,<3",
  "pydantic>=2.10,<3",
  "sqlalchemy>=2.0,<3",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
codex = [
  "openai-codex>=0.144,<1",
]
dev = [
  "httpx>=0.28,<1",
  "mypy>=1.14,<2",
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.25,<1",
  "ruff>=0.9,<1",
]

[project.scripts]
agent-bridge = "agent_bridge_bridge.cli:main"
agent-bridge-catalog = "agent_bridge_catalog.cli:main"
agent-bridge-node = "agent_bridge_node.cli:main"
agent-bridge-maintenance = "agent_bridge_catalog.maintenance:main"
agent-bridge-runner = "agent_bridge_bridge.runner_service:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"**/__init__.py" = ["F401"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["agent_bridge_bridge", "agent_bridge_catalog", "agent_bridge_coordinator", "agent_bridge_integrations", "agent_bridge_node", "agent_bridge_protocol", "agent_bridge_providers"]
